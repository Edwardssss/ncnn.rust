# Regular expressions for github/issue-labeler. The action requires every entry of
# a label to match, so alternatives live inside one case-insensitive regular
# expression instead of one entry per spelling.
bug:
  - '/\b(bug|crash(es|ed)?|segfault|panic|regression|hangs?|hanging)\b|wrong (result|output)|incorrect (result|value|output)|undefined behavio/i'

enhancement:
  - '/feature request|enhancement|proposal|support for/i'

documentation:
  - '/documentation|\breadme\b|doc comment/i'

question:
  - '/how (do|can|should) i\b|usage question/i'

performance:
  - '/performance|throughput|latency|benchmark|slow(er)? than/i'

build:
  - '/NCNN_INSTALL_DIR|NCNN_LINK_KIND|NCNN_EXTRA_LIB|bindgen|libclang|link(er|ing)? (error|failure)|build (script|error|failure)/i'

vulkan:
  - '/vulkan|lavapipe|gpu (device|backend|selection)/i'

platform:linux:
  - '/\b(linux|ubuntu)\b/i'

platform:windows:
  - '/\b(windows|msvc)\b/i'

platform:macos:
  - '/\b(macos|osx|darwin)\b|apple silicon/i'

platform:arm:
  - '/\b(arm|arm64|aarch64)\b/i'

needs-repro:
  - '/reproduc|minimal example/i'

needs-info:
  - '/no (model|param|bin|log|backtrace)/i'