version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Patch and minor bumps arrive as one pull request. Major bumps stay separate
      # because they change the generated bindings and need individual validation.
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    groups:
      # Action bumps only change the runtime the action runs on, so every update
      # type is grouped. The Pages actions must move together anyway.
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
