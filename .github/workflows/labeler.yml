name: Pull request labels

# The labeler reads the changed file list through the API, so it needs no checkout
# and no pull request code runs here. `pull_request_target` supplies the write token
# that fork pull requests do not receive under the plain `pull_request` event.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
