name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

env:
  NCNN_VERSION: "20261020"
  NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
  NCNN_LINK_KIND: dylib

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment holds CARGO_REGISTRY_TOKEN and records which tag published a version.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with the manifest publishes the wrong version, so the run stops
      # before anything leaves the runner.
      - name: Match the tag with the workspace version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          python3 tools/check-versions.py
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Cache ncnn SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-release-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      # cargo publish verifies the archive by building it, which compiles the adapters.
      - name: Build ncnn
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      # Re-running a tag push must not fail on the package it already published, and the safe
      # crate resolves the sys crate from the registry, so the index entry has to exist first.
      - name: Publish both packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          published() {
            curl -fsS -H 'User-Agent: ncnn.rust-release' \
              "https://crates.io/api/v1/crates/$1/$2" > /dev/null 2>&1
          }
          wait_for() {
            for _ in $(seq 1 60); do
              published "$1" "$VERSION" && return 0
              sleep 10
            done
            echo "$1 $VERSION never appeared in the index"
            return 1
          }
          if published ncnn-rust-sys "$VERSION"; then
            echo "ncnn-rust-sys $VERSION is already published"
          else
            cargo publish -p ncnn-rust-sys
            wait_for ncnn-rust-sys
          fi
          if published ncnn-rust "$VERSION"; then
            echo "ncnn-rust $VERSION is already published"
          else
            cargo publish -p ncnn-rust
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { collecting = 1; next }
            collecting && index($0, "## ") == 1 { exit }
            collecting { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$VERSION" --notes-file "$notes" --verify-tag
          fi
