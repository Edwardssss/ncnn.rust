name: ncnn version matrix

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NCNN_LINK_KIND: dylib
  NCNN_ALLOW_UNTESTED_VERSION: "1"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      pinned: ${{ steps.plan.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version plan
        id: plan
        env:
          # The tag list comes from the GitHub API, whose unauthenticated limit is per IP and
          # shared by hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ncnn-versions.py >> "$GITHUB_OUTPUT"

  compat:
    needs: resolve
    name: ncnn ${{ matrix.version }} (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The two backends of one release need their own prefix: a CPU SDK and a Vulkan SDK
      # cannot share a directory, and the cache key has to name both.
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-${{ matrix.version }}-${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
        # The Vulkan rows exist because the adapter calls the C++ Vulkan API, which the C API
        # declaration report cannot describe: the compiler is the report there.
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain
        run: |
          sudo apt-get update
          packages=(cmake clang libclang-dev)
          if [ "${{ matrix.backend }}" = "vulkan" ]; then
            packages+=(glslang-dev glslang-tools libvulkan-dev mesa-vulkan-drivers vulkan-tools)
          fi
          sudo apt-get install -y "${packages[@]}"
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Cache SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-${{ matrix.version }}-${{ matrix.backend }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/patches/*.patch') }}

      - name: Fetch source
        run: |
          mkdir -p vendor
          curl -fsSL "https://github.com/Tencent/ncnn/archive/refs/tags/${{ matrix.version }}.tar.gz" -o "vendor/ncnn-${{ matrix.version }}.tar.gz"
          tar -xzf "vendor/ncnn-${{ matrix.version }}.tar.gz" -C vendor

      - name: Build SDK
        run: |
          flag=""
          if [ "${{ matrix.backend }}" = "vulkan" ]; then flag="--vulkan"; fi
          python3 tools/build-ncnn-sdk.py "vendor/ncnn-${{ matrix.version }}" "$NCNN_INSTALL_DIR" $flag

      # A hosted runner has no GPU, so the software rasteriser is the device, and the suite
      # attaches it from NCNN_TEST_DEVICE. The ICD is proven here for the same reason the job
      # in `ci.yml` proves it: a missing device must not read as a pass.
      - name: Require a Vulkan device
        if: matrix.backend == 'vulkan' && matrix.version == needs.resolve.outputs.pinned
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
          summary="$(vulkaninfo --summary 2>&1)"
          echo "$summary"
          echo "$summary" | grep -q deviceName \
            || { echo "no Vulkan device answered, so the GPU cases would not run" >&2; exit 1; }

      # The adapter is written against one release, so an older SDK cannot link it. Those rows
      # report which declarations the pinned header needs that the build lacks, which is the
      # compatibility statement for that release.
      - name: Fetch the pinned header
        if: matrix.backend == 'cpu' && matrix.version != needs.resolve.outputs.pinned
        run: |
          mkdir -p vendor/pinned
          curl -fsSL "https://raw.githubusercontent.com/Tencent/ncnn/${{ needs.resolve.outputs.pinned }}/src/c_api.h" \
            -o vendor/pinned/c_api.h

      - name: Report the declaration gap
        if: matrix.backend == 'cpu' && matrix.version != needs.resolve.outputs.pinned
        run: |
          report="$RUNNER_TEMP/gap.txt"
          python3 tools/compat-gap.py --sdk "$NCNN_INSTALL_DIR" --baseline vendor/pinned/c_api.h | tee "$report"
          {
            echo "### ncnn ${{ matrix.version }}: C API"
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing in the C API report describes the C++ Vulkan classes the adapter uses, so the
      # compiler answers the same question for them: a signature or member that moved shows up
      # as a diagnostic naming it. A row that cannot compile reports instead of failing, because
      # an older release is expected to lack what the pinned one has.
      - name: Report the Vulkan build gap
        if: matrix.backend == 'vulkan' && matrix.version != needs.resolve.outputs.pinned
        run: |
          log="$RUNNER_TEMP/vulkan-gap.log"
          status=0
          cargo check --workspace --all-features --all-targets > "$log" 2>&1 || status=$?
          {
            echo "### ncnn ${{ matrix.version }}: Vulkan"
            if [ "$status" -eq 0 ]; then
              echo "The adapter compiles against this release with Vulkan."
            else
              echo "The adapter does not compile against this release with Vulkan:"
              echo '```'
              errors="$(grep -iE "error" "$log" | head -n 40)"
              if [ -n "$errors" ]; then echo "$errors"; else tail -n 40 "$log"; fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then tail -n 40 "$log"; fi

      - name: Interface and numerical compatibility
        if: matrix.backend == 'cpu' && matrix.version == needs.resolve.outputs.pinned
        env:
          # The SDK is shared, so the test binaries need its directory on the loader path.
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cargo test --workspace
          python3 tools/check-coverage.py

      - name: Vulkan suite on the software device
        if: matrix.backend == 'vulkan' && matrix.version == needs.resolve.outputs.pinned
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          # Attaches the device to every conformance fixture, so the operator, graph and layer
          # cases repeat on the GPU instead of only the Vulkan contracts.
          NCNN_TEST_DEVICE: vulkan
        run: cargo test --workspace --all-features

      - name: Native reference and trained models
        if: matrix.backend == 'cpu' && matrix.version == needs.resolve.outputs.pinned
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cmake -S crates/ncnn/tests/native -B target/reference-${{ matrix.version }} -DCMAKE_BUILD_TYPE=Release
          cmake --build target/reference-${{ matrix.version }} --config Release -j "$(nproc)"
          python3 tools/fetch-models.py
          cargo run -p ncnn-rust --example model_regression -- \
            target/model-fixtures "target/reference-${{ matrix.version }}/ncnn_cpu_reference"

      - name: Require the pinned release to match
        if: matrix.backend == 'cpu' && matrix.version == needs.resolve.outputs.pinned
        run: python3 tools/compat-gap.py --sdk "$NCNN_INSTALL_DIR" --require-compatible

      - name: Record result
        if: always()
        env:
          VERSION: ${{ matrix.version }}
          BACKEND: ${{ matrix.backend }}
          STATUS: ${{ job.status }}
        run: |
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "ncnn $VERSION ($BACKEND): $STATUS" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Summarise
        run: |
          echo "## ncnn version matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "Overall result: ${{ needs.compat.result }}. Each job writes its own per-release section, and a Vulkan row is green when the adapter compiles and, for the pinned release, the Vulkan-gated suite passes on the software device." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: needs.compat.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="ncnn version matrix failure"
          body="The scheduled compatibility matrix failed (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # The tracking issue describes a state, so a passing run ends it.
      - name: Close the tracking issue
        if: needs.compat.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="ncnn version matrix failure"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The matrix passed (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            gh issue close "$existing" --reason completed
          else
            echo "no open tracking issue"
          fi
