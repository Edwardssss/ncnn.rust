name: MSRV

# The declared minimum only regresses when a dependency, the lockfile or the toolchain file
# moves. The job still runs on every request so a required status check keeps reporting, and
# only the SDK build and the check behind it are skipped when no manifest changed.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  NCNN_VERSION: "20261020"
  NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
  NCNN_LINK_KIND: dylib

jobs:
  msrv:
    name: MSRV 1.85.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether a manifest changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
              if ! git diff --name-only "$base" HEAD \
                | grep -Eq '^(Cargo\.toml|Cargo\.lock|crates/[^/]+/Cargo\.toml|rust-toolchain\.toml)$'; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "manifest change: $run"

      - uses: dtolnay/rust-toolchain@master
        if: steps.changes.outputs.run == 'true'
        with:
          toolchain: "1.85.1"

      - name: Cache ncnn SDK
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-msrv-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch and build ncnn
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Check with the declared minimum
        if: steps.changes.outputs.run == 'true'
        run: cargo check --workspace --all-targets
