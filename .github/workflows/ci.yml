name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      arm_mha_probe:
        description: Run the attention probe on the ARM runner and print the values
        type: boolean
        default: false

env:
  NCNN_VERSION: "20261020"
  NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
  NCNN_LINK_KIND: dylib

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is x86-64 and macos-15 is Apple Silicon, so both run natively.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache ncnn SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-${{ matrix.os }}-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang clang-format libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            choco install llvm --no-progress -y
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PATH=C:\Program Files\LLVM\bin;$env:NCNN_INSTALL_DIR\bin;$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The tool scripts use python3 so one command works on every runner.
          if (!(Get-Command python3 -ErrorAction SilentlyContinue)) {
            $source = (Get-Command python).Source
            Copy-Item $source (Join-Path (Split-Path $source) 'python3.exe')
          }
          python3 --version

      - name: Fetch pinned ncnn source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-ncnn.py

      - name: Build ncnn SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          clang-format --dry-run --Werror crates/ncnn-sys/native/*.cpp crates/ncnn-sys/native/*.h

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The shared SDK lives outside the default loader path; Windows gets it from PATH.
      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          DYLD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

      - name: Examples
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          DYLD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cargo run -p ncnn-rust --example add
          cargo run -p ncnn-rust --example typed_tensors

      # A second pass catches state that only breaks after the first one.
      - name: Repeat the suite
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

      # The Documentation workflow deploys on main, so the link check for a pull request belongs
      # here rather than in the deploy.
      - name: Check rustdoc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo doc --workspace --no-deps

      # The generated INT8/operator fixtures compare Rust against a standalone C++
      # reference built from the same SDK, without downloading trained models.
      - name: Model regression (generated fixtures)
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cmake -S crates/ncnn/tests/native -B target/cpu-reference -DCMAKE_BUILD_TYPE=Release
          cmake --build target/cpu-reference --config Release --parallel 2
          cargo run -p ncnn-rust --example model_regression -- \
            target/cpu-sdk-fixtures target/cpu-reference/ncnn_cpu_reference --compact

      - name: Version consistency
        if: runner.os == 'Linux'
        run: python3 tools/check-versions.py

      # Publish dry runs are the release gate: they package, rebuild from the archive
      # and validate the registry metadata for both packages. The main package is
      # verified against the archive built in the previous step, because ncnn-rust-sys
      # is not on crates.io until the release publishes it first.
      - name: Publish dry run
        if: runner.os == 'Linux'
        run: |
          cargo publish -p ncnn-rust-sys --dry-run --allow-dirty
          # The safe crate requires the version under test, which the registry does not
          # carry until the release publishes it, so the archive stands in for it.
          sys_dir="$(find "$PWD/target/package" -maxdepth 1 -type d -name 'ncnn-rust-sys-[0-9]*' -print -quit)"
          cat > "$RUNNER_TEMP/patch.toml" <<EOF
          [patch.crates-io]
          ncnn-rust-sys = { path = "$sys_dir" }
          EOF
          cargo publish -p ncnn-rust --dry-run --allow-dirty --config "$RUNNER_TEMP/patch.toml"

  # The publish gate compiles the archive, and this job consumes it: a separate crate
  # depends on the packaged files, which is the only path that sees the published
  # manifest, the packaged file list and the runtime library lookup a user gets.
  packaged:
    name: Packaged crate build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache ncnn SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-ubuntu-latest-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch pinned ncnn source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-ncnn.py

      - name: Build ncnn SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Package both crates
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cargo package -p ncnn-rust-sys --no-verify
          tar -xzf "$(ls target/package/ncnn-rust-sys-[0-9]*.crate | head -n1)" -C "$RUNNER_TEMP/packages"
          sys_dir="$(find "$RUNNER_TEMP/packages" -maxdepth 1 -type d -name 'ncnn-rust-sys-[0-9]*' | head -n1)"
          cat > "$RUNNER_TEMP/patch.toml" <<EOF
          [patch.crates-io]
          ncnn-rust-sys = { path = "$sys_dir" }
          EOF
          cargo package -p ncnn-rust --no-verify --config "$RUNNER_TEMP/patch.toml"
          tar -xzf "$(ls target/package/ncnn-rust-[0-9]*.crate | head -n1)" -C "$RUNNER_TEMP/packages"
          ls "$RUNNER_TEMP/packages"

      - name: Build a crate that consumes the archives
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          sys_dir="$(echo "$RUNNER_TEMP"/packages/ncnn-rust-sys-*)"
          safe_dir="$(echo "$RUNNER_TEMP"/packages/ncnn-rust-[0-9]*)"
          crate="$RUNNER_TEMP/downstream"
          cp -r ci/downstream "$crate"
          sed -i "s|@SYS@|$sys_dir|; s|@SAFE@|$safe_dir|" "$crate/Cargo.toml.in"
          mv "$crate/Cargo.toml.in" "$crate/Cargo.toml"
          cd "$crate"
          cargo run

  msrv:
    name: MSRV 1.85.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.1"

      - name: Cache ncnn SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-msrv-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch and build ncnn
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Check with the declared minimum
        run: cargo check --workspace --all-targets

  arm64:
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache ncnn SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-arm64-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch and build ncnn
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Test on native ARM64
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

      # The layer case skips its finiteness assertion on this target because the ARM path
      # builds its own Gemm and Softmax. This dispatch runs the probe that prints every
      # configuration instead, so the failing values and the shapes that fail appear in the
      # log next to the same run on x86-64.
      - name: Probe the attention variants
        if: inputs.arm_mha_probe
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test -p ncnn-rust --test conformance attention_probe -- --nocapture --test-threads=1

  # Hosted runners expose no GPU, so this job repeats the whole suite on Mesa lavapipe.
  # NCNN_TEST_DEVICE attaches the software device to every conformance fixture, so the
  # operators, graphs and layer cases run on the GPU as well as on the host. System
  # glslang comes from distro packages; the first hosted run confirms that those
  # packages export the CMake targets ncnn expects.
  vulkan:
    name: Vulkan (Mesa lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-vulkan
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev glslang-dev glslang-tools libvulkan-dev mesa-vulkan-drivers vulkan-tools
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Cache ncnn Vulkan SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-vulkan-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Build ncnn with Vulkan
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}" --vulkan

      - name: Record Vulkan device
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
          vulkaninfo --summary || true

      - name: Test with the software Vulkan device
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          NCNN_TEST_DEVICE: vulkan
        run: cargo test --workspace --features vulkan

      # The other jobs build a CPU-only SDK, so the feature-gated test code is linted here.
      - name: Clippy with the Vulkan feature
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo clippy --workspace --all-targets --features vulkan -- -D warnings

      # Both examples reach the device, so they run where one exists.
      - name: Vulkan examples
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cargo run -p ncnn-rust --features vulkan --example add -- --vulkan
          cargo run -p ncnn-rust --features vulkan --example vulkan_resident

  # Line coverage of the Rust wrapper, reported as an artifact. The FFI adapters and the
  # native library stay outside the report, so the number describes the safe layer.
  # Offline link checking: local file targets and anchors only. Remote URLs stay out so a
  # third-party outage cannot fail a pull request.
  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            README.md README_zh.md CHANGELOG.md SECURITY.md CONTRIBUTING.md
            'docs/*.md' 'crates/*/README.md'
          fail: true

  # Compares the public API against the latest published release, so a breaking change
  # needs the version bump that allows it. cargo-semver-checks builds with every feature,
  # so the SDK has to enable Vulkan as well.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-vulkan
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev glslang-dev glslang-tools libvulkan-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Cache ncnn Vulkan SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-vulkan-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Build ncnn with Vulkan
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}" --vulkan

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Compare against the published API
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          for package in ncnn-rust-sys ncnn-rust; do
            echo "::group::$package"
            cargo semver-checks check-release --package "$package"
            echo "::endgroup::"
          done

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-cpu
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"
          cargo install cargo-llvm-cov --locked

      - name: Cache ncnn SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-cpu-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Build ncnn
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Report coverage
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          cargo llvm-cov --workspace --lcov --output-path coverage.lcov --fail-under-lines 85
          cargo llvm-cov report --summary-only

      # `--summary-only` alone produced an lcov with file totals and no `DA` records, which
      # looked like a report while carrying no per-line data.
      - name: Reject a report without line records
        run: |
          records="$(grep -c '^DA:' coverage.lcov || true)"
          echo "per-line records: $records"
          if [ "$records" -lt 1000 ]; then
            echo "coverage.lcov carries no usable line records"
            exit 1
          fi

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: error