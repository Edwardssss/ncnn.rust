name: CI

on:
  push:
  pull_request:

env:
  NCNN_VERSION: "20261020"
  NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
  NCNN_LINK_KIND: dylib

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is x86-64 and macos-15 is Apple Silicon, so both run natively.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache ncnn SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-${{ matrix.os }}-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang clang-format libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            choco install llvm --no-progress -y
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PATH=C:\Program Files\LLVM\bin;$env:NCNN_INSTALL_DIR\bin;$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The tool scripts use python3 so one command works on every runner.
          if (!(Get-Command python3 -ErrorAction SilentlyContinue)) {
            $source = (Get-Command python).Source
            Copy-Item $source (Join-Path (Split-Path $source) 'python3.exe')
          }
          python3 --version

      - name: Fetch pinned ncnn source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-ncnn.py

      - name: Build ncnn SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          clang-format --dry-run --Werror crates/ncnn-sys/native/*.cpp crates/ncnn-sys/native/*.h

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The shared SDK lives outside the default loader path; Windows gets it from PATH.
      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          DYLD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

      - name: Example
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
          DYLD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo run -p ncnn-rust --example add

      # A second pass catches state that only breaks after the first one.
      - name: Repeat the suite
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

      - name: Version consistency
        if: runner.os == 'Linux'
        run: python3 tools/check-versions.py

      # Publish dry runs are the release gate: they package, rebuild from the archive
      # and validate the registry metadata for both packages. The main package is
      # verified against the archive built in the previous step, because ncnn-rust-sys
      # is not on crates.io until the release publishes it first.
      - name: Publish dry run
        if: runner.os == 'Linux'
        run: |
          cargo publish -p ncnn-rust-sys --dry-run --allow-dirty
          # The safe crate requires the version under test, which the registry does not
          # carry until the release publishes it, so the archive stands in for it.
          sys_dir="$(find "$PWD/target/package" -maxdepth 1 -type d -name 'ncnn-rust-sys-[0-9]*' -print -quit)"
          cat > "$RUNNER_TEMP/patch.toml" <<EOF
          [patch.crates-io]
          ncnn-rust-sys = { path = "$sys_dir" }
          EOF
          cargo publish -p ncnn-rust --dry-run --allow-dirty --config "$RUNNER_TEMP/patch.toml"

  # The publish gate compiles the archive, and this job consumes it: a separate crate
  # depends on the packaged files, which is the only path that sees the published
  # manifest, the packaged file list and the runtime library lookup a user gets.
  packaged:
    name: Packaged crate build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache ncnn SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-ubuntu-latest-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch pinned ncnn source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch-ncnn.py

      - name: Build ncnn SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Package both crates
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cargo package -p ncnn-rust-sys --no-verify
          tar -xzf "$(ls target/package/ncnn-rust-sys-[0-9]*.crate | head -n1)" -C "$RUNNER_TEMP/packages"
          sys_dir="$(find "$RUNNER_TEMP/packages" -maxdepth 1 -type d -name 'ncnn-rust-sys-[0-9]*' | head -n1)"
          cat > "$RUNNER_TEMP/patch.toml" <<EOF
          [patch.crates-io]
          ncnn-rust-sys = { path = "$sys_dir" }
          EOF
          cargo package -p ncnn-rust --no-verify --config "$RUNNER_TEMP/patch.toml"
          tar -xzf "$(ls target/package/ncnn-rust-[0-9]*.crate | head -n1)" -C "$RUNNER_TEMP/packages"
          ls "$RUNNER_TEMP/packages"

      - name: Build a crate that consumes the archives
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: |
          sys_dir="$(echo "$RUNNER_TEMP"/packages/ncnn-rust-sys-*)"
          safe_dir="$(echo "$RUNNER_TEMP"/packages/ncnn-rust-[0-9]*)"
          crate="$RUNNER_TEMP/downstream"
          cp -r ci/downstream "$crate"
          sed -i "s|@SYS@|$sys_dir|; s|@SAFE@|$safe_dir|" "$crate/Cargo.toml.in"
          mv "$crate/Cargo.toml.in" "$crate/Cargo.toml"
          cd "$crate"
          cargo run

  msrv:
    name: MSRV 1.85.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.1"

      - name: Cache ncnn SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-msrv-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch and build ncnn
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Check with the declared minimum
        run: cargo check --workspace --all-targets

  arm64:
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-install
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache ncnn SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-arm64-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Fetch and build ncnn
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}"

      - name: Test on native ARM64
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace

  # Hosted runners expose no GPU, so this job validates the Vulkan contracts on
  # Mesa lavapipe. System glslang comes from distro packages; the first hosted
  # run confirms that those packages export the CMake targets ncnn expects.
  vulkan:
    name: Vulkan (Mesa lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NCNN_INSTALL_DIR: ${{ github.workspace }}/ncnn-vulkan
      NCNN_LINK_KIND: dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev glslang-dev glslang-tools libvulkan-dev mesa-vulkan-drivers vulkan-tools
          llvm_lib="$(llvm-config --libdir 2>/dev/null || true)"
          [ -n "$llvm_lib" ] || llvm_lib="$(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V | tail -1)"
          echo "LIBCLANG_PATH=$llvm_lib" >> "$GITHUB_ENV"

      - name: Cache ncnn Vulkan SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.NCNN_INSTALL_DIR }}
          key: ncnn-vulkan-${{ env.NCNN_VERSION }}-${{ hashFiles('tools/build-ncnn-sdk.py', 'tools/fetch-ncnn.py', 'tools/patches/*.patch') }}

      - name: Build ncnn with Vulkan
        run: |
          python3 tools/fetch-ncnn.py
          python3 tools/build-ncnn-sdk.py vendor/ncnn-${{ env.NCNN_VERSION }} "${{ env.NCNN_INSTALL_DIR }}" --vulkan

      - name: Record Vulkan device
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
          vulkaninfo --summary || true

      - name: Test with the software Vulkan device
        env:
          LD_LIBRARY_PATH: ${{ env.NCNN_INSTALL_DIR }}/lib
        run: cargo test --workspace --features vulkan
