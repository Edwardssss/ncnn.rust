name: Issue labels

# The issue tracker accepts free-form reports, so the labels come from the words a
# reporter uses. The action only reads the issue text and writes labels; nothing
# from the issue is executed.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
