name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # Major updates stay open for review; patch and minor updates merge once the
      # required checks pass, which branch protection enforces.
      #
      # The ruleset requires one approving review, so the workflow approves the
      # pull request itself before arming auto-merge. It stays armed until every
      # required check and every review thread is resolved, and the `synchronize`
      # trigger re-approves after a rebase dismisses the earlier approval.
      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
